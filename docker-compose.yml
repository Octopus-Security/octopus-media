services:
  frontend:
    build: ./frontend
    container_name: octopus_media_frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://media-backend:3001
    networks:
      - octopus_network

  backend:
    build: ./backend
    container_name: octopus_media_backend
    restart: unless-stopped
    environment:
      - PORT=3001
      # The public origin, used to build the sign-in/sign-out return URLs. The
      # code defaults to the same value, so this is documentation and an override
      # rather than a requirement. Deliberately NOT set on the frontend: its
      # middleware runs in Next's edge runtime, where process.env is inlined at
      # build time, so a runtime variable there would look wired up and do nothing.
      - PUBLIC_URL=${PUBLIC_URL:-https://media.octopustechnology.net}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-media}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB:-media}
      - SESSION_SECRET=${SESSION_SECRET}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://octopus-auth:3002}
      # Machine-to-machine auth for cortex (chat-driven show/episode updates).
      - INTERNAL_SECRET=${INTERNAL_SECRET:-}
      - MEDIA_OWNER=${MEDIA_OWNER:-psychopathy}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://media.octopustechnology.net}
    networks:
      octopus_network:
        aliases:
          - media-backend
      media_internal:
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./db
    container_name: octopus_media_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-media}
      - POSTGRES_USER=${POSTGRES_USER:-media}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-media}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - media_internal

volumes:
  postgres_data:

networks:
  octopus_network:
    external: true
  media_internal:
    internal: true
